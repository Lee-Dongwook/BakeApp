name: BakeApp PostgreSQL Schema
desc: BakeApp Studio의 인증·프로젝트·동적 데이터 스키마

# 실제 접속 정보는 저장소에 넣지 않습니다.
# `pnpm db:doc`가 server/.env의 DATABASE_URL을 TBLS_DSN으로 전달합니다.
docPath: docs/db

format:
  adjust: true
  sort: true

er:
  format: svg
  # 관계선은 유지하고 FOREIGN KEY 정의 문구만 숨겨 ERD 가독성을 높입니다.
  hideDef: true
  distance: 2

comments:
  - table: users
    tableComment: BakeApp 자체 인증 사용자
  - table: projects
    tableComment: 사용자가 소유하는 앱 빌더 프로젝트
  - table: project_documents
    tableComment: 프로젝트 편집 상태를 보관하는 JSON 문서
  - table: project_members
    tableComment: 프로젝트별 협업 권한
  - table: refresh_tokens
    tableComment: 해시된 갱신 토큰
  - table: project_schemas
    tableComment: 프로젝트별 동적 데이터 스키마 정의
  - table: tenant_limits
    tableComment: 사용자 플랜별 프로젝트 및 내보내기 한도
  - table: user_terms_agreements
    tableComment: 사용자 약관 및 선택 동의 이력
  - table: audit_logs
    tableComment: API 데이터 변경에 대한 감사 로그
  - table: project_versions
    tableComment: 프로젝트별 릴리즈 버전 스냅샷
  - table: project_deployments
    tableComment: 프로젝트별 현재 프로덕션 배포 버전
  - table: project_datasources
    tableComment: 프로젝트별 외부 데이터베이스 연결 설정
  - table: workflows
    tableComment: 프로젝트별 활성 워크플로우 노드 및 엣지 정의
  - table: workflow_logs
    tableComment: 워크플로우 실행 성공·실패 이력과 노드 실행 결과
  - table: workflow_runs
    tableComment: 워크플로우 실행 단위의 상태·입출력·오류 이력
  - table: workflow_step_runs
    tableComment: 워크플로우 실행 단계별 상태·재시도·처리 시간 이력
  - table: project_runtime_settings
    tableComment: 배포된 프로젝트를 런타임 앱으로 노출하기 위한 슬러그·공개 설정
  - table: project_environments
    tableComment: 프로젝트별 환경 변수와 암호화된 Secret 값
  - table: runtime_users
    tableComment: 프로젝트별 런타임(최종 사용자) 계정
