services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bakeapp}
      POSTGRES_USER: ${POSTGRES_USER:-bakeapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bakeapp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  tbls:
    image: k1low/tbls:v1.94.5
    profiles: ["tools"]
    working_dir: /work
    entrypoint: ["tbls"]
    environment:
      TBLS_DSN: postgresql://${POSTGRES_USER:-bakeapp}:${POSTGRES_PASSWORD:-bakeapp}@db:5432/${POSTGRES_DB:-bakeapp}?sslmode=disable
    volumes:
      - ./:/work
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bakeapp:bakeapp@db:5432/bakeapp}
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret-change-before-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
